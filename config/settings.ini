[app]
title = Airline Manager 4 Bot
url = https://www.airlinemanager.com/
appearance_mode = System
color_theme = blue
log_file = data/logs/am4bot.log

[settings]
; Buy when the price is at or below these values ($ per 1,000 units)
fuel_price_good = 380
co2_price_good = 110
; Amount to buy per purchase (capped by storage capacity and cash when they can be read)
fuel_quantity_buy = 99999
co2_quantity_buy = 999999
; Random pause between checks, in minutes
cycle_min_minutes = 5
cycle_max_minutes = 10
; Seconds to wait for the login to finish (captcha, manual login ...)
login_timeout = 300

[options]
auto_depart = on
autobuy_fuel = on
autobuy_co2 = on
start_on_launch = off
keep_session = on
headless = off
remember_credentials = on

[selectors]
; XPath expressions. If the game changes its layout, fix them here (no code change needed).
; "a | b" tries several alternatives in document order.
login_form = //*[@id='loginForm']
login_email = //*[@id='lEmail']
login_password = //*[@id='lPass']
login_remember = //*[@id='remember']
login_submit = //*[@id='btnLogin']
money = //*[@id='headerAccount'] | //nav//ul[1]/li[1]//span
points = //*[@id='headerPoints'] | //nav//ul[1]/li[2]/span[2]
popup_content = //*[@id='popContent']
nav_routes = //*[@id='mapRoutes']
depart_all = //*[@id='departAll']
nav_fuel = //*[contains(@onclick, 'fuel.php')]
fuel_main = //*[@id='fuelMain']
fuel_price = //*[@id='fuelMain']/div/div[1]/span[2]/b | //*[@id='fuelMain']//b[contains(., '$')]
fuel_amount = //*[@id='fuelMain']//*[@id='amountInput'] | //*[@id='fuelMain']//input[@type='number' or @type='text']
fuel_buy = //*[@id='fuelMain']//button[contains(., 'Purchase') or contains(., 'Buy')] | //*[@id='fuelMain']/div/div[7]/div/button[2]
co2_tab = //*[@id='popBtn2']
co2_main = //*[@id='co2Main']
co2_price = //*[@id='co2Main']/div/div[2]/span[2]/b | //*[@id='co2Main']//b[contains(., '$')]
co2_amount = //*[@id='co2Main']//*[@id='amountInput'] | //*[@id='co2Main']//input[@type='number' or @type='text']
co2_buy = //*[@id='co2Main']//button[contains(., 'Purchase') or contains(., 'Buy')] | //*[@id='co2Main']/div/div[8]/div/button[2]
