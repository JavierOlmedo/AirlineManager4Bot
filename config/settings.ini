[app]
title = Airline Manager 4 Bot
url = https://www.airlinemanager.com/
appearance_mode = System
color_theme = am4
log_file = data/logs/am4bot.log

[settings]
fuel_price_good = 650
co2_price_good = 125
fuel_quantity_buy = 9999999
co2_quantity_buy = 9999999
buy_percentile = 10
excellent_percentile = 10
history_days = 3
min_stock_pct = 15
stock_days = 3
market_max_spend_pct = 75
cycle_min_minutes = 5
cycle_max_minutes = 10
login_timeout = 300
repair_wear_pct = 50
check_hours_min = 24
cash_reserve = 100000
route_max_distance = 2500
route_max_distance_big = 6000
route_min_runway = 5000
hangar_min_free = 2
aircraft_model = 
aircraft_max_price = 0
goal_model = auto
ladder_budget_days = 1
ladder_max_payback = 5
fleet_actions_per_cycle = 2
summary_hour = 9
seats_max_payback = 3
marketing_campaign = 4
marketing_hours = 8

[options]
auto_depart = on
autobuy_fuel = on
autobuy_co2 = on
smart_buy = on
start_on_launch = off
keep_session = on
headless = off
remember_credentials = on
auto_repair = on
auto_check = on
auto_route = on
autobuy_aircraft = on
save_for_goal = on
goal_invest = on
auto_hangar = on
auto_seats = on
auto_mods = on
auto_marketing = on
marketing_eco = on
auto_checklist = on
dry_run = off
telegram = on
telegram_departures = on
auto_restart = on

[web]
enabled = on
host = 127.0.0.1
port = 8744
remote_instances =

[selectors]
login_form = //*[@id='loginForm']
login_email = //*[@id='lEmail']
login_password = //*[@id='lPass']
login_remember = //*[@id='remember']
login_submit = //*[@id='btnLogin']
money = //*[@id='headerAccount']
points = //*[@id='headerPoints']
popup_content = //*[@id='popContent']
nav_routes = //*[@id='mapRoutes']
nav_fuel = //div[contains(@class, 'menu-btn') and contains(@onclick, 'fuel.php')]
nav_maintenance = //div[contains(@class, 'menu-btn') and contains(@onclick, 'maintenance_main.php')]
nav_finances = //div[contains(@class, 'menu-btn') and contains(@onclick, 'finances.php')]
depart_all = //*[@id='departAll']
fuel_main = //*[@id='fuelMain']
fuel_price = //*[@id='fuelMain']//b[contains(., '$')]
fuel_holding = //*[@id='fuelMain']//*[@id='holding']
fuel_free = //*[@id='fuelMain']//*[@id='remCapacity']
fuel_timer = //*[@id='fuelTimer']
fuel_amount = //*[@id='fuelMain']//*[@id='amountInput']
fuel_buy = //*[@id='fuelMain']//button[contains(@onclick, 'mode=do')]
co2_tab = //*[@id='popBtn2']
co2_main = //*[@id='co2Main']
co2_price = //*[@id='co2Main']//b[contains(., '$')]
co2_holding = //*[@id='co2Main']//*[@id='holding']
co2_free = //*[@id='co2Main']//*[@id='remCapacity']
co2_timer = //*[@id='co2Timer']
co2_amount = //*[@id='co2Main']//*[@id='amountInput']
co2_buy = //*[@id='co2Main']//button[contains(@onclick, 'mode=do')]

