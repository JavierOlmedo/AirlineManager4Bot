; Copy this file to config/secrets.ini (git-ignored) or just type the
; credentials in the app with "Remember credentials" ticked.
[login]
username = you@example.com
password = your-password

; Optional: Telegram notifications. Create a bot with @BotFather to get the
; token, send the bot any message, then read your chat id from
; https://api.telegram.org/bot<TOKEN>/getUpdates
[telegram]
bot_token = 123456789:AAExampleTokenFromBotFather
chat_id = 123456789

; Optional: web dashboard from other devices of your network (phone, tablet).
; Set [web] host = 0.0.0.0 in settings.ini and choose a long random token here,
; then open http://<this-pc-ip>:8744/?token=<token> once on each device.
[web]
token = change-me-to-a-long-random-string
