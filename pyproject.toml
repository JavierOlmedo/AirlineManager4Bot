# Tool settings only: the bot is not a package (run it with python src/main.py, see the README).

[tool.ruff]
target-version = "py310"
line-length = 130
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
# Errors, likely bugs and unused names. B905 (zip strict) would only add noise to this code base.
select = ["E4", "E7", "E9", "F", "W6", "B"]
ignore = ["B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
